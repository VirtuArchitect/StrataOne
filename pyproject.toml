[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strataone"
version = "0.4.0"
description = "Vendor-agnostic, hypervisor-agnostic zero-touch orchestration for distributed infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "John Goulden" }
]
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
  "requests>=2.32,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.0,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "httpx>=0.28,<1",
  "pip-audit>=2.10,<3",
  "bandit>=1.9,<2",
]

[project.scripts]
strataone = "strataone.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/strataone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
