[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strataone"
version = "0.1.0"
description = "Vendor-agnostic, hypervisor-agnostic zero-touch orchestration for distributed infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "John Goulden" }
]
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
strataone = "strataone.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/strataone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
