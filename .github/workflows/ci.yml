name: StrataOne CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -c requirements-constraints.txt --upgrade pip setuptools && python -m pip install -c requirements-constraints.txt -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Audit Python dependencies
        run: python -m pip_audit --skip-editable

      - name: Static security scan
        run: python -m bandit -r src --severity-level medium

  supply-chain:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and SBOM tooling
        run: python -m pip install -c requirements-constraints.txt --upgrade pip setuptools build cyclonedx-bom

      - name: Build wheel
        run: python -m build --wheel

      - name: Generate CycloneDX SBOM
        run: python -m cyclonedx_py environment --output-format JSON --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: strataone-sbom
          path: sbom.cdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: "dist/*.whl"
          sbom-path: sbom.cdx.json

  docker:
    runs-on: ubuntu-latest
    needs: [test, supply-chain]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t strataone-api:ci .

      - name: Scan API image with Trivy table report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: strataone-api:ci
          format: table
          output: trivy-container-report.txt
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan API image with Trivy SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: strataone-api:ci
          format: sarif
          output: trivy-container-report.sarif
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload container scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strataone-container-scan
          path: |
            trivy-container-report.txt
            trivy-container-report.sarif

      - name: Enforce container vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: strataone-api:ci
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Validate Compose configuration
        run: docker compose config
